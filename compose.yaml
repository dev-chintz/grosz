# Na NAS: deploy/deploy.sh (kopia bazy → migracje → nowa wersja aplikacji).

services:
  migrate:
    build: .
    command: ["node", "server/src/migrate.ts"]
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: "no"
    profiles: ["tools"]

  app:
    build: .
    env_file: .env
    ports: ["8090:3000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
