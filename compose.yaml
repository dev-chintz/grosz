# Na NAS: deploy/deploy.sh (kopia bazy → migracje → nowa wersja aplikacji).
#
# Baza działa w kontenerze stosu Anvero. QNAP blokuje kontenerom połączenia do samego NAS-a
# (ani host.docker.internal, ani adres w sieci lokalnej nie odpowiadają na 5432), więc grosz
# dołącza do sieci Dockera, w której działa Postgres, i łączy się z nim po nazwie kontenera.

services:
  migrate:
    # Ten sam obraz co app (zbudowany w deploy.sh). Własny build: by tu nie zadziałał — docker compose build
    # pomija usługi z profilu tools, więc migracje szłyby ze starego obrazu bez nowych plików migracji.
    image: grosz:latest
    pull_policy: never
    command: ["node", "server/src/migrate.ts"]
    env_file: .env
    networks: [db]
    restart: "no"
    profiles: ["tools"]

  app:
    build:
      context: .
      # Wersja (commit) wbudowana w obraz — Ustawienia → Aktualizacja porównują ją z GitHubem.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: grosz:latest
    env_file: .env
    ports: ["8090:3000"]
    # Publiczne DNS-y: DNS Container Station bywa zawodny dla github.com (sprawdzanie aktualizacji).
    dns: [1.1.1.1, 8.8.8.8]
    # default: port 8090 wystawiony na NAS i dostęp do updatera; db: dostęp do Postgresa.
    networks: [default, db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

  # Aktualizacja z Ustawień (wzorem Anvero): ma gniazdo Dockera, ale nie wystawia portu — woła go tylko app,
  # z tokenem. Folder projektu montujemy pod tą samą ścieżką, bo deploy.sh montuje go dalej (alpine/git).
  updater:
    build: ./updater
    image: grosz-updater:latest
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
      PROJECT_DIR: ${GROSZ_DIR:-/share/Container/grosz}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${GROSZ_DIR:-/share/Container/grosz}:${GROSZ_DIR:-/share/Container/grosz}
    networks: [default]

networks:
  db:
    external: true
    name: ${PG_NETWORK:-anvero-db_default}
