# Na NAS: deploy/deploy.sh (kopia bazy → migracje → nowa wersja aplikacji).
#
# Baza działa w kontenerze stosu Anvero. QNAP blokuje kontenerom połączenia do samego NAS-a
# (ani host.docker.internal, ani adres w sieci lokalnej nie odpowiadają na 5432), więc grosz
# dołącza do sieci Dockera, w której działa Postgres, i łączy się z nim po nazwie kontenera.

services:
  migrate:
    # Ten sam obraz co app (zbudowany w deploy.sh). Własny build: by tu nie zadziałał — docker compose build
    # pomija usługi z profilu tools, więc migracje szłyby ze starego obrazu bez nowych plików migracji.
    image: grosz:latest
    pull_policy: never
    command: ["node", "server/src/migrate.ts"]
    env_file: .env
    networks: [db]
    restart: "no"
    profiles: ["tools"]

  app:
    build: .
    image: grosz:latest
    env_file: .env
    ports: ["8090:3000"]
    # default: port 8090 wystawiony na NAS; db: dostęp do Postgresa.
    networks: [default, db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  db:
    external: true
    name: ${PG_NETWORK:-anvero-db_default}
